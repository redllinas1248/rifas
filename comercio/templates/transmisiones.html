{% extends "base.html" %}
{% block content %}

<div class="dir-header">

<!-- ===== REPRODUCTOR ===== -->
<div class="youtube-live-wrap" style="margin-bottom:1rem;">

<!-- ===== BOTONES DE COMPARTIR (FUERA del contenedor) ===== -->

<!-- ===== BOTÓN DE NOTIFICACIONES (sigue donde estaba) ===== -->
<div style="margin-bottom:1rem; text-align:center;">
  <button id="push-subscribe-btn" class="p-btn-save" style="background:var(--accent2); padding:0.6rem 1.5rem; border-radius:99px; border:none; cursor:pointer;">
    🔔 Activar notificaciones
  </button>
  <span id="push-status" style="margin-left:0.5rem; font-size:0.8rem; color:var(--muted);"></span>
</div>

<!-- ===== ANUNCIO ROTATORIO ===== -->
<div id="ad-rotator" class="ad-container" style="margin: 1rem 0; min-height: 120px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div class="ad-label">Anuncio</div>
  <div id="ad-content">
    <p style="color:var(--muted); font-size:0.8rem;">Cargando anuncio...</p>
  </div>
</div>

<!-- ===== LISTA DE TRANSMISIONES ===== -->
<div id="transmisiones-wrap">
  <div id="transmisiones-lista" class="trans-lista">
    <!-- Cargado dinámicamente -->
  </div>
</div>

<script>
// ===== COMPARTIR =====
function compartirFacebook() {
  const url = encodeURIComponent(window.location.href);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank', 'width=600,height=400');
}

function compartirWhatsApp() {
  const url = encodeURIComponent(window.location.href);
  const msg = encodeURIComponent('📺 ¡Mira esta transmisión en vivo!');
  window.open(`https://wa.me/?text=${msg}%20${url}`, '_blank');
}

// ===== FUNCIÓN PARA OBTENER URL DE EMBED =====
function obtenerEmbedUrl(url) {
  url = url.trim();
  if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url) && url.includes('-')) {
    return `https://www.youtube.com/embed/${url}`;
  }
  if (url.includes('youtube.com/watch?v=')) {
    const videoId = url.split('v=')[1].split('&')[0];
    return `https://www.youtube.com/embed/${videoId}`;
  }
  if (url.includes('youtu.be/')) {
    const videoId = url.split('youtu.be/')[1].split('?')[0];
    return `https://www.youtube.com/embed/${videoId}`;
  }
  if (url.includes('youtube.com/embed/')) {
    return url;
  }
  if (url.includes('youtube.com/live_stream?channel=')) {
    return url;
  }
  return url;
}

// ===== CARGAR TRANSMISIONES =====
async function cargarTransmisiones() {
  const wrap = document.getElementById('transmisiones-lista');
  wrap.innerHTML = `<div class="spinner-feed"><span></span><span></span><span></span></div>`;
  try {
    const transmisiones = await api('/api/transmisiones/publicas');
    if (!transmisiones.length) {
      wrap.innerHTML = `<div class="empty"><div class="empty-icon">📺</div><p>No hay transmisiones disponibles en este momento.</p></div>`;
      return;
    }

    const destacada = transmisiones.find(t => t.destacada) || transmisiones[0];
    const embedUrl = obtenerEmbedUrl(destacada.url);
    document.getElementById('reproductor').src = embedUrl;
    document.getElementById('reproductor-titulo').textContent = destacada.titulo;
    document.getElementById('reproductor-sub').textContent = destacada.descripcion || '🔴 En vivo';

    const categorias = {
      noticias: { icono: '📰', label: 'Noticias', items: [] },
      deportes: { icono: '⚽', label: 'Deportes', items: [] },
      eventos: { icono: '🎥', label: 'Eventos especiales', items: [] }
    };

    transmisiones.forEach(t => {
      if (categorias[t.categoria]) {
        categorias[t.categoria].items.push(t);
      }
    });

    let html = '';
    for (const [key, cat] of Object.entries(categorias)) {
      if (!cat.items.length) continue;
      html += `
        <div class="dir-grupo">
          <div class="dir-grupo-titulo">${cat.icono} ${cat.label}</div>
          <div class="dir-lista">
            ${cat.items.map(t => `
              <div class="dir-item">
                <div class="dir-ico">${cat.icono}</div>
                <div class="dir-info">
                  <div class="dir-nombre">${escapeHtml(t.titulo)}</div>
                  ${t.descripcion ? `<div class="dir-dato">${escapeHtml(t.descripcion)}</div>` : ''}
                  ${t.destacada ? `<span style="color:#f59e0b;font-size:.7rem;font-weight:600;">⭐ Destacada</span>` : ''}
                </div>
                <button class="dir-tel-btn" style="background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.3);cursor:pointer;" 
                        onclick="cambiarTransmision('${escapeHtml(t.url)}', '${escapeHtml(t.titulo)}', '${escapeHtml(t.descripcion || '🔴 En vivo')}')">
                  <span class="live-dot" style="display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%;margin-right:4px;animation:pulse-dot 1.2s ease-in-out infinite;"></span>
                  Ver ahora
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    wrap.innerHTML = html;

  } catch(e) {
    wrap.innerHTML = `<div class="empty"><p>${escapeHtml(e.message)}</p></div>`;
  }
}

// ===== CAMBIAR TRANSMISIÓN =====
function cambiarTransmision(url, titulo, descripcion) {
  const embedUrl = obtenerEmbedUrl(url);
  document.getElementById('reproductor').src = embedUrl;
  document.getElementById('reproductor-titulo').textContent = titulo;
  document.getElementById('reproductor-sub').textContent = descripcion || '🔴 En vivo';
}

// ===== NOTIFICACIONES PUSH =====
async function suscribirPush() {
  const btn = document.getElementById('push-subscribe-btn');
  const status = document.getElementById('push-status');
  try {
    const resp = await api('/api/push/vapid_public_key');
    const publicKey = resp.public_key;
    if (!publicKey) {
      status.textContent = '❌ Clave VAPID no configurada.';
      return;
    }

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      status.textContent = '❌ Permiso denegado.';
      return;
    }

    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: publicKey
    });

    await api('/api/push/subscribe', 'POST', subscription.toJSON());

    btn.style.display = 'none';
    status.textContent = '✅ Notificaciones activadas.';
    status.style.color = 'var(--success)';
  } catch (e) {
    status.textContent = '❌ Error: ' + e.message;
    status.style.color = 'var(--error)';
    console.error(e);
  }
}

async function verificarSuscripcion() {
  const btn = document.getElementById('push-subscribe-btn');
  const status = document.getElementById('push-status');
  if (!('Notification' in window) || !('PushManager' in window)) {
    status.textContent = '❌ Tu navegador no soporta notificaciones.';
    return;
  }
  if (Notification.permission === 'denied') {
    status.textContent = '❌ Notificaciones bloqueadas.';
    btn.style.display = 'none';
    return;
  }
  if (Notification.permission === 'granted') {
    try {
      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.getSubscription();
      if (subscription) {
        btn.style.display = 'none';
        status.textContent = '✅ Notificaciones activadas.';
        status.style.color = 'var(--success)';
        return;
      }
    } catch (e) {}
  }
  btn.style.display = 'inline-block';
  status.textContent = '';
}

// ============================================================
// ===== ANUNCIOS ROTATORIOS (cada 3 minutos) =================
// ============================================================

// IDs de tus anuncios de Adsterra (reemplaza con los tuyos)
const adUnitIds = [
    'c8faf59902984dd8cbd09b2dbce9b59a',  // Banner 728x90
    '3c28692570519f7a1f14c0a8fd20aa78'   // Banner 300x250
];
let currentAdIndex = 0;

function rotateAd() {
    const adContainer = document.getElementById('ad-content');
    if (!adContainer) return;

    const adId = adUnitIds[currentAdIndex];
    currentAdIndex = (currentAdIndex + 1) % adUnitIds.length;

    adContainer.innerHTML = `
        <script>
            atOptions = {
                'key' : '${adId}',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        <\/script>
        <script src="https://www.highperformanceformat.com/${adId}/invoke.js"><\/script>
    `;

    const scripts = adContainer.querySelectorAll('script');
    scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
        });
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, newScript);
    });
}

setTimeout(() => {
    rotateAd();
    setInterval(rotateAd, 180000);
}, 1500);

// ============================================================

// ===== INICIO =====
document.addEventListener('DOMContentLoaded', async function() {
  await cargarTransmisiones();
  await verificarSuscripcion();
});

document.getElementById('push-subscribe-btn').addEventListener('click', suscribirPush);
</script>

{% endblock %}
